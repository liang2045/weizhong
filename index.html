<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>产品资源卡片中心</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Resource Hub</p>
        <h1>产品资源卡片中心</h1>
        <p class="subtitle">用统一卡片快速打开详情页、主图、SKU、白底图、网盘链接和产品资料。</p>
      </div>
      <div class="header-actions">
        <button id="updateBtn" class="btn btn-secondary" type="button">更新</button>
        <button id="newCardBtn" class="btn btn-primary" type="button">新建卡片</button>
      </div>
    </header>

    <main>
      <section class="sync-panel" aria-label="同步配置">
        <label for="syncUrl">团队同步地址</label>
        <div class="sync-row">
          <input id="syncUrl" type="url" placeholder="例如：https://company.example.com/products.json 或 ./products.json" />
          <button id="saveSyncBtn" class="btn btn-dark" type="button">保存地址</button>
        </div>
        <p>管理员把导出的产品 JSON 放到共享地址，其他同事点击“更新”即可同步新增或修改的卡片。</p>
      </section>

      <section class="toolbar" aria-label="列表工具栏">
        <div>
          <strong id="cardCount">0 个产品</strong>
          <span>拖动卡片或使用上移/下移按钮调整位置。</span>
        </div>
        <div class="toolbar-actions">
          <button id="exportBtn" class="link-button" type="button">导出配置</button>
          <label class="link-button file-label" for="importInput">导入配置</label>
          <input id="importInput" type="file" accept="application/json" hidden />
        </div>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" hidden>还没有产品卡片，请点击“新建卡片”开始配置。</p>
    </main>

    <dialog id="cardDialog" class="dialog">
      <form id="cardForm" method="dialog" class="dialog-card">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Card settings</p>
            <h2 id="dialogTitle">设置产品卡片</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
        </div>

        <input id="editingId" type="hidden" />

        <div class="form-grid">
          <label>
            产品名
            <input id="productName" required maxlength="80" placeholder="请输入品名" />
          </label>
          <label>
            定价文字
            <input id="productPrice" maxlength="80" placeholder="例如：¥299 / FOB $19.9" />
          </label>
        </div>

        <label>
          产品图上传
          <input id="productImage" type="file" accept="image/*" />
        </label>
        <div id="imagePreview" class="image-preview">未上传图片时会显示默认占位图</div>

        <fieldset>
          <legend>按钮地址配置</legend>
          <div id="linkFields" class="link-fields"></div>
        </fieldset>

        <div class="dialog-actions">
          <button id="deleteBtn" class="btn btn-danger" type="button">删除卡片</button>
          <div>
            <button class="btn btn-secondary" value="cancel" type="submit">取消</button>
            <button id="saveCardBtn" class="btn btn-primary" type="button">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <template id="cardTemplate">
      <article class="product-card" draggable="true">
        <div class="image-wrap">
          <img class="product-image" alt="" />
          <div class="product-meta">
            <h3></h3>
            <p></p>
          </div>
        </div>
        <div class="button-grid"></div>
        <div class="card-controls">
          <button class="move-btn" data-direction="up" type="button" aria-label="上移">↑</button>
          <button class="move-btn" data-direction="down" type="button" aria-label="下移">↓</button>
          <button class="settings-btn" type="button" aria-label="设置">⚙</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
